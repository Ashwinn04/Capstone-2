version: '3.8'

services:
  # Sepsis Prediction API Service
  sepsis-api:
    build:
      context: .
      target: production
    container_name: sepsis-prediction-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - LOG_LEVEL=info
    volumes:
      - ./outputs:/app/outputs
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - sepsis-network

  # Sepsis Dashboard
  sepsis-dashboard:
    build:
      context: .
      target: dashboard
    container_name: sepsis-dashboard
    ports:
      - "8501:8501"
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./outputs:/app/outputs
    depends_on:
      - sepsis-api
    restart: unless-stopped
    networks:
      - sepsis-network

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: sepsis-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - sepsis-network

  # PostgreSQL for data storage (optional)
  postgres:
    image: postgres:15-alpine
    container_name: sepsis-postgres
    environment:
      POSTGRES_DB: sepsis_db
      POSTGRES_USER: sepsis_user
      POSTGRES_PASSWORD: sepsis_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - sepsis-network

  # Nginx reverse proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: sepsis-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - sepsis-api
      - sepsis-dashboard
    restart: unless-stopped
    networks:
      - sepsis-network

volumes:
  redis-data:
  postgres-data:

networks:
  sepsis-network:
    driver: bridge
